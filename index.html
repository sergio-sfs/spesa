<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2e8b57">
<title>Lista della spesa</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1f2a24;--mut:#6b7a72;--ac:#2e8b57;--bd:#e2e6e1;--hl:#fff1b8}
@media(prefers-color-scheme:dark){:root{--bg:#141815;--card:#1e2420;--tx:#e8ede9;--mut:#8a9a91;--ac:#4fbf84;--bd:#2c352f;--hl:#4d4421}}
*{box-sizing:border-box}
body{margin:0 auto;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:560px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
form{margin-bottom:8px}
.r2{display:flex;gap:8px;margin-top:8px}
input[type=text],input[type=search],input[type=date],select{padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px;min-width:0}
#n,#t{width:100%}
#t{margin-bottom:10px;color:#d92d20;font-weight:600}
@media(prefers-color-scheme:dark){#t{color:#ff6b5e}}
.sub:empty{display:none}
#q{width:84px}
#u{width:92px}
#c{flex:1}
.r3{display:flex;gap:10px;margin-top:8px;align-items:center}
.add{flex:1}
.pm{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--mut);font-size:15px}
.pm input{width:22px;height:22px;accent-color:#e8590c}
.tag{background:#e8590c;color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
button{border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#fff;font-size:16px;cursor:pointer}
.dt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dt label{color:var(--mut);font-size:14px;white-space:nowrap}
#d{flex:1}
.tools{display:flex;gap:8px;margin:12px 0 10px}
#s{flex:1}
#o{width:140px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.cats button{background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:6px 10px;font-size:13px;border-radius:16px}
.cats button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:14px;margin:16px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.it{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.it.hl{background:var(--hl)}
.it>input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac)}
.it span{flex:1;word-break:break-word;cursor:pointer}
.it em{font-style:normal;margin-right:6px}
.it small{color:var(--mut);font-size:14px;margin-left:6px}
.it.d span{text-decoration:line-through;color:var(--mut)}
.x{background:none;color:var(--mut);padding:2px 8px;font-size:20px}
.ed{flex-wrap:wrap}
.ed .nm{flex:1 1 100%}
.ed .qq{width:84px}
.ed .uu{width:92px}
.ed .cc{flex:1;min-width:130px}
.ed button{flex:1}
.ed button.cn{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--mut);font-size:13px}
.foot button{background:none;color:var(--ac);padding:6px;font-size:14px}
.msg{padding:12px;border:1px dashed var(--bd);border-radius:10px;color:var(--mut);text-align:center}
.nw{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--hl);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.nw[hidden]{display:none}
.nw button{padding:6px 10px;font-size:13px;white-space:nowrap}
.lists{display:flex;gap:8px;margin-bottom:10px}
#L{flex:1}
.lists button{padding:10px 12px;font-size:16px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.pd{display:none}
.pd b{color:#d92d20;font-size:20px}
@media print{
  :root{--bg:#fff;--card:#fff;--tx:#000;--mut:#444;--bd:#bbb;--hl:#fff1b8}
  body{padding:0;max-width:none}
  .sub,.dt,.lists,.nw,form,.cats,.tools,#t,.x,#clr,#pr{display:none!important}
  .pd{display:block;font-size:15px;margin-bottom:10px}
  .it{break-inside:avoid;border-radius:0;border-width:0 0 1px 0;padding:8px 0;margin:0}
  h2{margin-top:14px;break-after:avoid}
}
</style>
</head>
<body>
<h1>🛒 Lista della spesa</h1>
<div class="sub" id="st">Connessione…</div>
<div class="lists"><select id="L" aria-label="Liste"></select><button id="nl" title="Nuova lista">＋</button><button id="sh" title="Condividi">📤</button><button id="dl" title="Elimina lista">🗑️</button></div>
<input type="text" id="t" placeholder="📝 Titolo o nota della lista (es. Esselunga sabato)" maxlength="80" autocomplete="off">
<div class="dt"><label for="d">📅 Data spesa</label><input type="date" id="d"></div>
<div class="pd"><b id="pdt"></b><div id="pdd"></div></div>
<form id="f">
<input type="text" id="n" placeholder="Aggiungi prodotto…" autocomplete="off" enterkeyhint="done">
<div class="r2">
<input type="text" id="q" inputmode="decimal" placeholder="Qtà" autocomplete="off">
<select id="u"></select>
<select id="c"></select>
</div>
<div class="r3"><label class="pm"><input type="checkbox" id="pm"> 🏷️ Promo</label><button class="add">＋ Aggiungi</button></div>
</form>
<div class="tools"><input type="search" id="s" placeholder="🔍 Cerca…" autocomplete="off"><select id="o" aria-label="Ordinamento"></select></div>
<div class="nw" id="nw" hidden><span id="nwt"></span><button id="nwb">Segna come viste</button></div>
<div class="cats" id="cats"></div>
<div id="list"></div>
<div class="foot"><span id="cnt"></span><button id="pr">📄 PDF</button><button id="clr" hidden>Rimuovi spuntati</button></div>
<script>
const DB_URL="https://spesa-famiglia-88183-default-rtdb.europe-west1.firebasedatabase.app";
const CATS=["🥬 Frutta e verdura","🥛 Latticini","🥩 Carne e pesce","🧀 Salumi e formaggi","🍞 Pane e forno","🍝 Dispensa","🧊 Surgelati","🥤 Bevande","🍪 Colazione e dolci","🧴 Casa e igiene","🍕 Pizza","🥘 Gastronomia","🍽️ Ristorante","🐾 Animali","💊 Farmacia","📦 Altro"];
const OTHER=CATS[CATS.length-1];
const UNITS=["pz","kg","g","l","ml","conf"];
const SORTS=[["cat","Per categoria"],["az","A → Z"],["new","Più recenti"],["old","Inseriti prima"]];
let items=[],busy=0,editId=null,flt="",mode="cat",pdfP=null;
const idOk=h=>/^[a-z0-9]{3,20}$/.test(h);
let curId=location.hash.slice(1);
if(!idOk(curId)){try{curId=localStorage.getItem("spesa_list")||"main"}catch(e){curId="main"}if(!idOk(curId))curId="main"}
let base=curId==="main"?"":"/lists/"+curId;
let snap=null,loaded=false;
const SK=()=>"spesa_snap_"+curId;
function loadSnap(){try{const s=localStorage.getItem(SK());snap=s?JSON.parse(s):null}catch(e){snap=null}}
function saveSnap(){try{localStorage.setItem(SK(),JSON.stringify(snap))}catch(e){}}
const sig=i=>[i.name,i.qty,i.unit,i.cat,i.done?1:0,i.promo?1:0].join("|");
function allSeen(){snap={};items.forEach(i=>{snap[i.id]=sig(i)});saveSnap()}
function mine(i){if(!snap)return;snap[i.id]=sig(i);saveSnap()}
function gone(id){if(!snap)return;delete snap[id];saveSnap()}
const isNew=i=>!!snap&&snap[i.id]!==sig(i);
try{mode=localStorage.getItem("spesa_sort")||"cat"}catch(e){}
if(!SORTS.some(s=>s[0]===mode))mode="cat";
const $=id=>document.getElementById(id);
const api=(p,m,b)=>fetch(DB_URL+base+"/items"+p+".json",{method:m||"GET",body:b!==undefined?JSON.stringify(b):undefined}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()});
const meta=(k,v)=>fetch(DB_URL+base+"/meta/"+k+".json",{method:"PUT",body:JSON.stringify(v)}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status)});
function fill(sel,arr){arr.forEach(x=>{const o=document.createElement("option");o.textContent=x;sel.appendChild(o)})}
fill($("u"),UNITS);fill($("c"),CATS);$("c").value=OTHER;
SORTS.forEach(s=>{const o=document.createElement("option");o.value=s[0];o.textContent=s[1];$("o").appendChild(o)});
$("o").value=mode;
function cmp(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  if(mode==="new")return b.ts-a.ts;
  if(mode==="old")return a.ts-b.ts;
  return a.name.localeCompare(b.name,"it");
}
function groups(list){
  if(mode==="cat")return CATS.map(c=>({t:c,l:list.filter(i=>i.cat===c).sort(cmp)})).filter(g=>g.l.length);
  return list.length?[{t:"",l:list.slice().sort(cmp)}]:[];
}
function fmt(v){return new Date(v+"T12:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function showHead(){
  const t=$("t").value.trim(),v=$("d").value;
  $("pdt").textContent=t;$("pdd").textContent=v?"Spesa del "+fmt(v):"";
}
function chips(){
  const ch=$("cats");ch.textContent="";
  const counts={};items.forEach(i=>{counts[i.cat]=(counts[i.cat]||0)+1});
  const chip=(label,val)=>{
    const b=document.createElement("button");b.type="button";b.textContent=label;
    b.classList.toggle("on",flt===val);
    b.onclick=()=>{flt=(flt===val)?"":val;if(flt&&flt!=="__promo")$("c").value=flt;render()};
    ch.appendChild(b);
  };
  chip("Tutte ("+items.length+")","");
  const np=items.filter(i=>i.promo).length;
  if(np||flt==="__promo")chip("🏷️ Promo "+np,"__promo");
  CATS.filter(c=>counts[c]||flt===c).forEach(c=>chip(c+" "+(counts[c]||0),c));
}
function render(){
  chips();
  const L=$("list");L.textContent="";
  const qs=$("s").value.trim().toLowerCase();
  const vis=items.filter(i=>(!flt||(flt==="__promo"?i.promo:i.cat===flt))&&(!qs||i.name.toLowerCase().includes(qs)));
  if(!vis.length){const d=document.createElement("div");d.className="msg";d.textContent=items.length?"Nessun risultato":"Lista vuota. Aggiungi il primo prodotto!";L.appendChild(d)}
  groups(vis).forEach(g=>{
    if(g.t){const h=document.createElement("h2");h.textContent=g.t;L.appendChild(h)}
    g.l.forEach(i=>{
      if(editId===i.id){
        const e=document.createElement("div");e.className="it ed";
        const n=document.createElement("input");n.type="text";n.className="nm";n.value=i.name;n.maxLength=100;
        const q=document.createElement("input");q.type="text";q.className="qq";q.inputMode="decimal";q.placeholder="Qtà";q.value=i.qty;
        const u=document.createElement("select");u.className="uu";fill(u,UNITS);u.value=UNITS.includes(i.unit)?i.unit:"pz";
        const k=document.createElement("select");k.className="cc";fill(k,CATS);k.value=i.cat;
        const sv=document.createElement("button");sv.type="button";sv.textContent="Salva";
        const cn=document.createElement("button");cn.type="button";cn.className="cn";cn.textContent="Annulla";
        const pl=document.createElement("label");pl.className="pm";
        const pc=document.createElement("input");pc.type="checkbox";pc.checked=!!i.promo;pl.append(pc," 🏷️ Promo");
        sv.onclick=()=>{const nm=n.value.trim();if(!nm)return;i.name=nm;i.qty=q.value.trim().slice(0,10);i.unit=i.qty?u.value:"";i.cat=k.value;i.promo=pc.checked;mine(i);editId=null;render();w(()=>api("/"+i.id,"PATCH",{name:i.name,qty:i.qty,unit:i.unit,cat:i.cat,promo:i.promo}))};
        cn.onclick=()=>{editId=null;render()};
        e.append(n,q,u,k,pl,sv,cn);L.appendChild(e);return;
      }
      const r=document.createElement("div");r.className="it"+(i.done?" d":"")+(i.hl?" hl":"");
      const cb=document.createElement("input");cb.type="checkbox";cb.checked=!!i.done;
      cb.onchange=()=>{i.done=cb.checked;mine(i);render();w(()=>api("/"+i.id,"PATCH",{done:i.done}))};
      const s=document.createElement("span");s.textContent=i.name;
      const pre=(isNew(i)?"🆕":"")+(mode!=="cat"?i.cat.split(" ")[0]:"");
      if(pre){const ic=document.createElement("em");ic.textContent=pre;s.insertBefore(ic,s.firstChild)}
      if(i.qty){const m=document.createElement("small");m.textContent="· "+i.qty+(i.unit?" "+i.unit:"");s.appendChild(m)}
      if(i.promo){const t=document.createElement("b");t.className="tag";t.textContent="PROMO";s.appendChild(t)}
      s.onclick=()=>{i.hl=!i.hl;render();w(()=>api("/"+i.id,"PATCH",{hl:i.hl}))};
      const p=document.createElement("button");p.className="x";p.textContent="✏️";p.setAttribute("aria-label","Modifica");
      p.onclick=()=>{editId=i.id;render()};
      const x=document.createElement("button");x.className="x";x.textContent="×";x.setAttribute("aria-label","Elimina");
      x.onclick=()=>{
        if(!confirm("Eliminare «"+i.name+"»?"))return;
        items=items.filter(o=>o.id!==i.id);gone(i.id);render();w(()=>api("/"+i.id,"DELETE"));
      };
      r.append(cb,s,p,x);L.appendChild(r);
    });
  });
  const nn=items.filter(isNew).length;
  const dn=(loaded&&snap)?Object.keys(snap).filter(id=>!items.some(i=>i.id===id)).map(id=>String(snap[id]).split("|")[0]):[];
  const tot=nn+dn.length;
  $("nw").hidden=!tot;
  $("nwt").textContent=[nn?"🔔 "+nn+(nn===1?" nuova o modificata":" nuove o modificate"):"",dn.length?"🗑️ "+dn.length+(dn.length===1?" eliminata: ":" eliminate: ")+dn.slice(0,3).join(", ")+(dn.length>3?"…":""):""].filter(Boolean).join(" · ");
  document.title=(tot?"("+tot+") ":"")+"Lista della spesa";
  const left=items.filter(i=>!i.done).length;
  $("cnt").textContent=items.length?left+" da prendere":"";
  $("clr").hidden=items.length===left;
}
function w(fn){busy++;fn().catch(e=>{$("st").textContent="Errore di rete: riprova"}).finally(()=>{busy--})}
async function load(){
  if(busy||editId)return;
  try{
    const my=curId;
    const root=await fetch(DB_URL+"/.json").then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})||{};
    if(busy||editId||my!==curId)return;
    const lists=root.lists||{};
    if(curId!=="main"&&!lists[curId]){location.hash="#main";return}
    const cur=curId==="main"?root:lists[curId];
    const o=cur.items||{},m=cur.meta||{};
    items=Object.keys(o).map(k=>({id:k,name:String(o[k].name||""),qty:String(o[k].qty||""),unit:String(o[k].unit||""),cat:CATS.includes(o[k].cat)?o[k].cat:OTHER,done:!!o[k].done,hl:!!o[k].hl,promo:!!o[k].promo,ts:o[k].ts||0})).filter(i=>i.name);
    if(document.activeElement!==$("d"))$("d").value=typeof m.date==="string"?m.date:"";
    if(document.activeElement!==$("t"))$("t").value=typeof m.title==="string"?m.title:"";
    if(snap===null)allSeen();
    loaded=true;
    buildLists(root);
    showHead();
    $("st").textContent=m.shared===true?"🔗 Condivisa":"";
    render();
  }catch(e){$("st").textContent="Offline: riprovo…"}
}
$("d").onchange=()=>{showHead();const v=$("d").value;w(()=>meta("date",v))};
$("t").onchange=()=>{showHead();const v=$("t").value.trim().slice(0,80);w(()=>meta("title",v))};
let lsig="";
function buildLists(root){
  const L=root.lists||{};
  const ids=["main",...Object.keys(L).sort()];
  const lab=id=>{
    const m=id==="main"?root.meta:(L[id]||{}).meta;
    let t=(m&&m.title)||(id==="main"?"Lista principale":"Lista senza nome");
    if(m&&typeof m.date==="string"&&m.date.length===10)t+=" · "+m.date.slice(8,10)+"/"+m.date.slice(5,7);
    return t;
  };
  const sig=ids.map(id=>id+"="+lab(id)).join("|")+"#"+curId;
  if(sig!==lsig){
    lsig=sig;const s=$("L");s.textContent="";
    ids.forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=lab(id);s.appendChild(o)});
    s.value=curId;
  }
}
function switchList(id){
  if(id===curId)return;
  curId=id;base=id==="main"?"":"/lists/"+id;
  items=[];flt="";editId=null;lsig="";loaded=false;loadSnap();
  ["t","d","s"].forEach(k=>{$(k).value=""});showHead();
  try{localStorage.setItem("spesa_list",id)}catch(e){}
  render();load();
}
window.onhashchange=()=>{const h=location.hash.slice(1);switchList(idOk(h)?h:"main")};
$("L").onchange=()=>{location.hash="#"+$("L").value};
$("nl").onclick=async()=>{
  const name=prompt("Nome della nuova lista (es. Esselunga sabato)");
  if(name===null)return;
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  busy++;
  try{
    const r=await fetch(DB_URL+"/lists/"+id+"/meta.json",{method:"PUT",body:JSON.stringify({title:name.trim().slice(0,80)||"Nuova lista",date:""})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    location.hash="#"+id;
  }catch(e){$("st").textContent="Errore di rete: riprova"}
  finally{busy--}
};
$("dl").onclick=async()=>{
  const main=curId==="main";
  if(!confirm(main?"Svuotare la lista principale? Verranno eliminati voci, titolo e data.":"Eliminare questa lista e tutte le sue voci?"))return;
  busy++;
  try{
    if(main){
      for(const k of ["items","meta"]){const r=await fetch(DB_URL+"/"+k+".json",{method:"DELETE"});if(!r.ok)throw new Error("HTTP "+r.status)}
      items=[];flt="";editId=null;lsig="";snap={};saveSnap();$("st").textContent="";
      ["t","d","s"].forEach(k=>{$(k).value=""});showHead();render();
    }else{
      const r=await fetch(DB_URL+"/lists/"+curId+".json",{method:"DELETE"});
      if(!r.ok)throw new Error("HTTP "+r.status);
      location.hash="#main";
    }
  }catch(e){$("st").textContent="Errore di rete: riprova"}
  finally{busy--}
};
$("sh").onclick=async()=>{
  const url=location.origin+location.pathname+"#"+curId;
  const title=$("t").value.trim()||"Lista della spesa";
  const mark=()=>{w(()=>meta("shared",true));$("st").textContent="🔗 Condivisa"};
  try{if(navigator.share){await navigator.share({title,text:"Lista della spesa: "+title,url});mark();return}}catch(e){if(e&&e.name==="AbortError")return}
  try{await navigator.clipboard.writeText(url);mark();alert("Link copiato: incollalo in un messaggio")}catch(e){prompt("Copia il link:",url)}
};
$("s").oninput=render;
$("o").onchange=()=>{mode=$("o").value;try{localStorage.setItem("spesa_sort",mode)}catch(e){}render()};
$("f").onsubmit=e=>{
  e.preventDefault();
  const v=$("n").value.trim();if(!v)return;
  const q=$("q").value.trim().slice(0,10);
  const id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const it={name:v,qty:q,unit:q?$("u").value:"",cat:$("c").value,done:false,hl:false,promo:$("pm").checked,ts:Date.now()};
  items.push({id,...it});mine({id,...it});render();
  w(()=>api("/"+id,"PUT",it));
  $("n").value="";$("q").value="";$("pm").checked=false;$("n").focus();
};
$("clr").onclick=()=>{
  const d=items.filter(i=>i.done);if(!d.length)return;
  if(!confirm("Rimuovere "+d.length+(d.length===1?" prodotto spuntato?":" prodotti spuntati?")))return;
  items=items.filter(i=>!i.done);d.forEach(i=>gone(i.id));render();
  d.forEach(i=>w(()=>api("/"+i.id,"DELETE")));
};
function pdfLib(){
  if(window.jspdf)return Promise.resolve();
  if(!pdfP)pdfP=new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload=res;s.onerror=()=>{pdfP=null;rej(new Error("jspdf"))};
    document.head.appendChild(s);
  });
  return pdfP;
}
async function makePdf(){
  const btn=$("pr");btn.disabled=true;
  try{
    try{await pdfLib()}catch(e){showHead();window.print();return}
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4"});
    const cl=t=>String(t).replace(/[^\x20-\x7E -ÿ]/g,"").trim();
    const L=15;let y=20;
    const title=cl($("t").value)||"Lista della spesa";
    doc.setFont("helvetica","bold");doc.setFontSize(18);doc.setTextColor(217,45,32);
    doc.text(title,L,y);y+=8;
    const v=$("d").value;
    doc.setFont("helvetica","normal");doc.setFontSize(11);doc.setTextColor(90);
    if(v){doc.text(cl("Spesa del "+fmt(v)),L,y);y+=7}
    doc.setTextColor(0);y+=3;
    const need=h=>{if(y+h>285){doc.addPage();y=20}};
    if(!items.length){doc.setFontSize(12);doc.text("Lista vuota",L,y)}
    groups(items).forEach(g=>{
      if(g.t){
        need(16);y+=3;
        doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(0);
        doc.text(cl(g.t).toUpperCase(),L,y);y+=2;
        doc.setDrawColor(180);doc.line(L,y,195,y);y+=6;
      }
      doc.setFont("helvetica","normal");doc.setFontSize(12);
      g.l.forEach(i=>{
        const q=i.qty?"  -  "+i.qty+(i.unit?" "+i.unit:""):"";
        const ls=doc.splitTextToSize(cl(i.name+q+(i.promo?"  [PROMO]":"")),170);
        need(6*ls.length+2);
        if(i.hl){doc.setFillColor(255,241,184);doc.rect(L-1.5,y-4.8,182,6*ls.length+.6,"F")}
        doc.setDrawColor(0);doc.rect(L,y-3.6,4,4);
        if(i.done){doc.line(L+.6,y-3,L+3.4,y-.4);doc.line(L+3.4,y-3,L+.6,y-.4);doc.setTextColor(130)}else doc.setTextColor(0);
        doc.text(ls,L+7,y);
        y+=6*ls.length+1;
      });
    });
    const blob=doc.output("blob");
    const file=new File([blob],"lista-spesa.pdf",{type:"application/pdf"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return}
    }catch(e){if(e&&e.name==="AbortError")return}
    const u=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=u;a.download="lista-spesa.pdf";a.target="_blank";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),60000);
  }finally{btn.disabled=false}
}
$("pr").onclick=()=>{makePdf().catch(()=>{$("st").textContent="Errore PDF: riprova"})};
$("nwb").onclick=()=>{allSeen();render()};
window.addEventListener("pagehide",()=>{if(loaded)allSeen()});
loadSnap();render();
if(!DB_URL){$("st").textContent="Database non ancora configurato"}
else{load();setInterval(load,4000);document.addEventListener("visibilitychange",()=>{if(document.hidden){if(loaded)allSeen()}else load()});pdfLib().catch(()=>{})}
</script>
